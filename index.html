<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap OCR</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --ink:#e8eaed; --muted:#9aa1ac; --accent:#5b8def; --line:#2a2e36; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:680px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button, label.btn { appearance:none; border:0; background:var(--accent); color:#fff; padding:12px 16px; border-radius:10px;
    font:inherit; font-weight:600; cursor:pointer; flex:1 1 auto; text-align:center; }
  button.secondary, label.btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.secondary[aria-pressed="true"] { background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=file] { display:none; }
  select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .opts { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:.9rem; }
  progress { width:100%; height:10px; margin-top:12px; display:none; }
  #status { color:var(--muted); font-size:.9rem; margin-top:8px; min-height:1.3em; overflow-wrap:anywhere; }
  textarea { width:100%; min-height:220px; font:inherit; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); resize:vertical; }
  .hist-item { border-top:1px solid var(--line); padding:10px 0; cursor:pointer; }
  .hist-item:first-child { border-top:0; }
  .hist-item small { color:var(--muted); display:block; }
  .hist-item span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hidden { display:none; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:4px 0 16px; }
  .ducks { display:flex; justify-content:center; gap:6px; margin-bottom:4px; }
  .ducks svg { display:block; }
  .ducks .flip { transform:scaleX(-1); }

  /* photo editor: boxes over the photo */
  .stagewrap { text-align:center; margin-top:12px; }
  #stage { position:relative; display:inline-block; max-width:100%; line-height:0; border-radius:8px; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair; }
  #view { display:block; max-width:100%; max-height:60vh; width:auto; height:auto; }
  .box { position:absolute; border:2px dashed #e24b4a; background:rgba(20,20,20,.88); cursor:move; }
  #stage.keep .box { border-color:#1d9e75; background:rgba(29,158,117,.2); }
  .box .h { position:absolute; right:0; bottom:0; width:26px; height:26px; background:var(--accent); cursor:nwse-resize;
    clip-path:polygon(100% 0, 100% 100%, 0 100%); }
  .box .x { position:absolute; right:0; top:0; width:26px; height:26px; padding:0; border-radius:0 0 0 8px; background:#e24b4a;
    color:#fff; font-size:18px; line-height:26px; flex:none; }
  #stage.keep .box .x { background:#1d9e75; }
</style>
</head>
<body>
<main>
  <h1>Snap OCR</h1>

  <section class="card">
    <div class="row">
      <label class="btn" for="cam">📷 Take photo</label>
      <label class="btn secondary" for="file">🖼️ Choose image</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <input id="file" type="file" accept="image/*">

    <div class="opts">
      <label>Language
        <select id="lang">
          <option value="eng">English</option>
          <option value="fra">French</option>
          <option value="spa">Spanish</option>
          <option value="deu">German</option>
          <option value="ita">Italian</option>
          <option value="por">Portuguese</option>
        </select>
      </label>
      <label><input type="checkbox" id="enhance" checked> Enhance image</label>
    </div>

    <progress id="bar" max="1" value="0"></progress>
    <div id="status" role="status"></div>
  </section>

  <section class="card hidden" id="editor">
    <div class="row">
      <button type="button" id="modeSkip" class="secondary" aria-pressed="true">Skip areas</button>
      <button type="button" id="modeKeep" class="secondary" aria-pressed="false">Keep only</button>
    </div>
    <div class="stagewrap"><div id="stage"><canvas id="view"></canvas></div></div>
    <div id="boxhint" class="opts"></div>
    <div class="row" style="margin-top:12px">
      <button type="button" id="undo" class="secondary">Undo</button>
      <button type="button" id="clearBoxes" class="secondary">Clear boxes</button>
    </div>
    <button type="button" id="scan" style="width:100%;margin-top:12px">Scan text</button>
  </section>

  <section class="card hidden" id="resultCard">
    <textarea id="out" aria-label="Recognized text"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="copy">Copy</button>
      <button id="download" class="secondary">Download .txt</button>
    </div>
    <div id="conf" class="opts"></div>
  </section>

  <section class="card hidden" id="histCard">
    <strong>History</strong> <small style="color:var(--muted)">(stored only on this device)</small>
    <div id="hist"></div>
    <div class="row" style="margin-top:12px"><button id="clearHist" class="secondary">Clear history</button></div>
  </section>
</main>
<footer>
  <div class="ducks">
    <svg width="44" height="40" viewBox="0 0 44 40" role="img" aria-label="Small yellow rubber duck">
      <ellipse cx="20" cy="27" rx="15" ry="9" fill="#ffd43b"/>
      <circle cx="30" cy="14" r="8" fill="#ffd43b"/>
      <path d="M37 14l6 2.5-6 2.5z" fill="#f08c00"/>
      <circle cx="32" cy="12" r="1.5" fill="#1c1f24"/>
      <path d="M9 24c3 5 11 6 15 2" fill="none" stroke="#f5b800" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="flip" width="44" height="40" viewBox="0 0 44 40" role="img" aria-label="Small blue rubber duck">
      <ellipse cx="20" cy="27" rx="15" ry="9" fill="#4dabf7"/>
      <circle cx="30" cy="14" r="8" fill="#4dabf7"/>
      <path d="M37 14l6 2.5-6 2.5z" fill="#f08c00"/>
      <circle cx="32" cy="12" r="1.5" fill="#1c1f24"/>
      <path d="M9 24c3 5 11 6 15 2" fill="none" stroke="#228be6" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div>Snap OCR v<span id="ver"></span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const VERSION = '0.01c';   // minor: 0.01a, 0.01b … 0.01z, 0.01aa …  major: 0.02, 0.03 …
const $ = id => document.getElementById(id);
$('ver').textContent = VERSION;
document.title = 'Snap OCR ' + VERSION;

const MAX_SIDE = 2200;            // downscale big phone photos for speed
let worker = null, workerLang = null, busy = false;

function setStatus(msg) { $('status').textContent = msg; }

async function getWorker(lang) {
  if (typeof Tesseract === 'undefined') throw new Error('The OCR library did not load.');
  if (worker && workerLang === lang) return worker;
  if (worker) { await worker.terminate(); worker = null; }
  worker = await Tesseract.createWorker(lang, 1, {
    logger: m => {
      if (m.status === 'recognizing text') {
        const pct = Math.round(m.progress * 100);
        $('bar').value = m.progress;
        setStatus('Reading text… ' + pct + '%');
        $('scan').textContent = 'Reading… ' + pct + '%';
      } else if (m.status && m.status.includes('loading')) {
        setStatus('Loading OCR engine (first run only)…');
      }
    }
  });
  workerLang = lang;
  return worker;
}

// Load a photo, fix phone rotation (EXIF) and downscale. No filters yet.
async function toCanvas(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d', { willReadFrequently: true }).drawImage(bmp, 0, 0, w, h);
  return c;
}

// Grayscale + auto-contrast, in place.
function enhance(c) {
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const w = c.width, h = c.height;
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114) | 0;
    d[i] = d[i+1] = d[i+2] = g; hist[g]++;
  }
  const total = w * h; let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.01) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.01) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.max(0, Math.min(255, ((d[i] - lo) * 255) / span));
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- photo editor: skip or keep boxes ----------
const stage = $('stage'), view = $('view');
let srcCanvas = null, boxes = [], els = [], undoStack = [], mode = 'skip', drag = null;
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));

function place(el, b) {
  el.style.left = b.x * 100 + '%'; el.style.top = b.y * 100 + '%';
  el.style.width = b.w * 100 + '%'; el.style.height = b.h * 100 + '%';
}

function updateHint() {
  const n = boxes.length, s = n === 1 ? 'area' : 'areas';
  $('boxhint').textContent = !n
    ? 'Drag on the photo to draw a box. With no boxes, the whole photo is read.'
    : mode === 'skip' ? n + ' ' + s + ' will be skipped. Drag a box to move it, or drag its corner to resize.'
                      : 'Only ' + n + ' ' + s + ' will be read. Drag a box to move it, or drag its corner to resize.';
}

function render() {
  els.forEach(e => e.remove()); els = [];
  boxes.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'box'; el.dataset.i = i;
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove this box');
    const h = document.createElement('div'); h.className = 'h';
    el.append(x, h); place(el, b); stage.appendChild(el); els.push(el);
  });
  $('undo').disabled = !undoStack.length;
  $('clearBoxes').disabled = !boxes.length;
  updateHint();
}

function setMode(m) {
  mode = m;
  stage.classList.toggle('keep', m === 'keep');
  $('modeSkip').setAttribute('aria-pressed', String(m === 'skip'));
  $('modeKeep').setAttribute('aria-pressed', String(m === 'keep'));
  updateHint();
}
$('modeSkip').onclick = () => setMode('skip');
$('modeKeep').onclick = () => setMode('keep');

function rel(e) {
  const r = stage.getBoundingClientRect();
  return { x: clamp((e.clientX - r.left) / r.width), y: clamp((e.clientY - r.top) / r.height), r };
}

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.x')) return;               // handled on click
  const p = rel(e), boxEl = e.target.closest('.box'), pre = JSON.stringify(boxes);
  if (boxEl && e.target.classList.contains('h')) {
    drag = { t: 'resize', i: +boxEl.dataset.i, pre };
  } else if (boxEl) {
    const i = +boxEl.dataset.i, b = boxes[i];
    drag = { t: 'move', i, pre, dx: p.x - b.x, dy: p.y - b.y };
  } else {
    boxes.push({ x: p.x, y: p.y, w: 0, h: 0 });
    render();
    drag = { t: 'draw', i: boxes.length - 1, pre, sx: p.x, sy: p.y };
  }
  try { stage.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});

stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = rel(e), b = boxes[drag.i];
  if (drag.t === 'draw') {
    b.x = Math.min(drag.sx, p.x); b.y = Math.min(drag.sy, p.y);
    b.w = Math.abs(p.x - drag.sx); b.h = Math.abs(p.y - drag.sy);
  } else if (drag.t === 'move') {
    b.x = clamp(p.x - drag.dx, 0, 1 - b.w); b.y = clamp(p.y - drag.dy, 0, 1 - b.h);
  } else {
    b.w = clamp(p.x - b.x, 40 / p.r.width, 1 - b.x);
    b.h = clamp(p.y - b.y, 40 / p.r.height, 1 - b.y);
  }
  place(els[drag.i], b);
});

function endDrag() {
  if (!drag) return;
  const r = stage.getBoundingClientRect(), b = boxes[drag.i];
  if (drag.t === 'draw' && (b.w * r.width < 24 || b.h * r.height < 24)) {
    boxes.pop();                                    // too small: treat as a stray tap
  } else if (JSON.stringify(boxes) !== drag.pre) {
    undoStack.push(drag.pre);
  }
  drag = null;
  render();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (!x) return;
  const i = +x.parentElement.dataset.i;
  undoStack.push(JSON.stringify(boxes));
  boxes.splice(i, 1);
  render();
});

$('undo').onclick = () => {
  if (!undoStack.length) return;
  boxes = JSON.parse(undoStack.pop());
  render();
};
$('clearBoxes').onclick = () => {
  if (!boxes.length) return;
  undoStack.push(JSON.stringify(boxes));
  boxes = [];
  render();
};

async function loadPhoto(file) {
  if (!file || busy) return;
  try {
    setStatus('Loading photo…');
    srcCanvas = await toCanvas(file);
    view.width = srcCanvas.width; view.height = srcCanvas.height;
    view.getContext('2d').drawImage(srcCanvas, 0, 0);
    boxes = []; undoStack = []; render();
    $('editor').classList.remove('hidden');
    $('resultCard').classList.add('hidden');
    setStatus('Draw boxes over anything to skip, or tap Scan text to read the whole photo.');
    $('editor').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    console.error(e);
    setStatus('Could not open that photo: ' + (e.message || e));
  }
}

// Build the image the OCR sees: enhance first, then paint skipped areas white
// (or, in keep mode, white out everything outside the boxes).
function buildInput() {
  const work = document.createElement('canvas');
  work.width = srcCanvas.width; work.height = srcCanvas.height;
  const ctx = work.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(srcCanvas, 0, 0);
  if ($('enhance').checked) enhance(work);
  if (!boxes.length) return work;
  const W = work.width, H = work.height;
  const px = b => [Math.round(b.x * W), Math.round(b.y * H), Math.max(1, Math.round(b.w * W)), Math.max(1, Math.round(b.h * H))];
  if (mode === 'skip') {
    ctx.fillStyle = '#fff';
    boxes.forEach(b => ctx.fillRect(...px(b)));
    return work;
  }
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const octx = out.getContext('2d');
  octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H);
  boxes.forEach(b => { const [x, y, w, h] = px(b); octx.drawImage(work, x, y, w, h, x, y, w, h); });
  return out;
}

async function scan() {
  if (!srcCanvas || busy) return;
  busy = true;
  $('resultCard').classList.add('hidden');
  $('bar').style.display = 'block'; $('bar').value = 0;
  $('scan').disabled = true;
  try {
    setStatus('Preparing image…');
    const input = buildInput();
    const w = await getWorker($('lang').value);
    const { data } = await w.recognize(input);
    const text = data.text.trim();
    $('out').value = text || '(No text found. Try better light, hold steady, and fill the frame with the text.)';
    $('conf').textContent = text ? 'Confidence: ' + Math.round(data.confidence) + '%' : '';
    $('resultCard').classList.remove('hidden');
    setStatus('Done.');
    if (text) saveHistory(text);
    $('resultCard').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    console.error(e);
    worker = null; workerLang = null;
    setStatus('Something went wrong: ' + (e.message || e));
  } finally {
    $('bar').style.display = 'none';
    $('scan').disabled = false; $('scan').textContent = 'Scan text';
    busy = false;
  }
}
$('scan').onclick = scan;

['cam', 'file'].forEach(id => $(id).addEventListener('change', e => {
  loadPhoto(e.target.files[0]); e.target.value = '';
}));

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('out').value); setStatus('Copied.'); }
  catch { $('out').select(); try { document.execCommand('copy'); } catch {} setStatus('Copied.'); }
};

$('download').onclick = () => {
  const blob = new Blob([$('out').value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ocr-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
};

// ---- history (text only, localStorage) ----
const KEY = 'snapocr-history';
function loadHistory() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function saveHistory(text) {
  const h = loadHistory();
  h.unshift({ t: Date.now(), text });
  try { localStorage.setItem(KEY, JSON.stringify(h.slice(0, 30))); } catch {}
  renderHistory();
}
function renderHistory() {
  const h = loadHistory(), box = $('hist');
  box.innerHTML = '';
  $('histCard').classList.toggle('hidden', !h.length);
  h.forEach(item => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    const s = document.createElement('small'); s.textContent = new Date(item.t).toLocaleString();
    const p = document.createElement('span'); p.textContent = item.text.replace(/\s+/g, ' ');
    div.append(s, p);
    div.onclick = () => { $('out').value = item.text; $('conf').textContent = ''; $('resultCard').classList.remove('hidden'); $('resultCard').scrollIntoView({ behavior: 'smooth' }); };
    box.appendChild(div);
  });
}
$('clearHist').onclick = () => { if (confirm('Clear all saved results on this device?')) { localStorage.removeItem(KEY); renderHistory(); } };
renderHistory();
render();
</script>
</body>
</html>
